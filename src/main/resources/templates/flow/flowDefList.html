<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:attr="data-ctx=@{/}">
<head>
    <meta charset="UTF-8">
    <title>流程定义列表</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        .toolbar{height:48px;background:#2c3e50;display:flex;gap:10px;align-items:center;padding:0 16px;}
        .toolbar a{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:14px;color:#fff;text-decoration:none;}
        .toolbar a:hover{color:#ffd166;transition:color 0.2s;}
        .container{width:96%;margin:20px auto;}
        h3{margin-bottom:16px;color:#2c3e50;}
        table{
            width:100%;
            border-collapse:collapse;
            background:#fff;
            box-shadow:0 1px 12px rgba(0,0,0,0.08);
            border-radius:8px;
            overflow:hidden;
            table-layout: fixed; /* 固定列宽，不会被长文本撑变形 */
        }
        th,td{
            padding:14px 12px;
            text-align:left;
            border-bottom:1px solid #eee;
            white-space: nowrap;
            overflow:hidden;
            text-overflow:ellipsis; /* 超出显示省略号 */
        }
        /* 分配每一列宽度 */
        th:nth-child(1){width:14%;}
        th:nth-child(2){width:14%;}
        th:nth-child(3){width:8%;}
        th:nth-child(4){width:24%;}
        th:nth-child(5){width:28%;}
        th:nth-child(6){width:12%;}

        th{
            background:#2c3e50;
            color:#fff;
            font-weight:normal;
            position: relative;
            user-select: none;
            /* 常驻列分割白线，一直看得见 */
            border-right:1px solid rgba(255,255,255,0.3);
        }
        /* 最后一列表头取消右边框，避免多余竖线 */
        th:last-child{
            border-right: none;
        }
        tr:hover{background:#f3f6fa;}
        .btn{padding:4px 10px;border-radius:4px;text-decoration:none;font-size:13px;}
        .btn-view{background:#3490dc;color:#fff;}

        /* 拖拽分割把手 */
        #defTable th .col-resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 3px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            z-index: 2;
        }
        #defTable th .col-resizer:hover {
            background: rgba(255,255,255,0.55);
        }
    </style>
<script th:src="@{/js/ctx.js}"></script>
</head>
<body>
<div class="toolbar">
    <a th:href="@{/home/index}">🏠主页</a>
</div>
<div class="container">
    <h3>📋 已定义流程列表</h3>
    <table id="defTable" style="table-layout:fixed;width:100%;border-collapse:collapse;">
        <thead>
        <tr>
            <th>流程名称</th>
            <th>流程Key</th>
            <th>版本</th>
            <th>定义ID</th>
            <th>资源文件</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <tr><td colspan="6">加载中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const tableBody = document.getElementById("tableBody");
    async function loadDefList(){
        const res = await fetch("/flowDef/list");
        const list = await res.json();
        if(list.length === 0){
            tableBody.innerHTML = "<tr><td colspan='6'>暂无流程定义</td></tr>";
            return;
        }
        let html = "";
        list.forEach(item=>{
            html += `
            <tr>
                <td title="${item.name || '-'}">${item.name || '-'}</td>
                <td title="${item.key}">${item.key}</td>
                <td>V${item.version}</td>
                <td title="${item.id}">${item.id}</td>
                <td title="${item.resourceName}">${item.resourceName}</td>
                <td>
                    <a class="btn btn-view" target="_blank" href="${(window.ctxUrl ? ctxUrl('/flowDef/view') : '/flowDef/view')}?processDefinitionId=${item.id}">查看流程图</a>
                </td>
            </tr>
            `
        })
        tableBody.innerHTML = html;
    }
    loadDefList();

    document.addEventListener('DOMContentLoaded', function () {
        const table = document.getElementById('defTable');
        if (!table) return;

        const ths = table.querySelectorAll('th');
        let dragging = false;
        let startX = 0;
        let startWidth = 0;
        let dragTh = null;
        const MIN_WIDTH = 60; // 最小列宽

        // 给每个th插入拖拽条
        ths.forEach(th => {
            const resizer = document.createElement('div');
            resizer.className = 'col-resizer';
            th.appendChild(resizer);

            resizer.addEventListener('mousedown', function (e) {
                dragging = true;
                dragTh = th;
                startX = e.pageX;
                startWidth = th.offsetWidth;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
        });

        document.addEventListener('mousemove', function (e) {
            if (!dragging || !dragTh) return;
            const dx = e.pageX - startX;
            const newW = startWidth + dx;
            if (newW >= MIN_WIDTH) {
                dragTh.style.width = newW + 'px';
            }
        });

        document.addEventListener('mouseup', function () {
            if (dragging) {
                dragging = false;
                dragTh = null;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });
    });
</script>
</body>
</html>
