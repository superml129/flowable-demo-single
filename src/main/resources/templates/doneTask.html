<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>已办任务列表</title>
    <link rel="stylesheet" th:href="@{/css/todoTask.css}">
</head>
<body>
<div th:replace="~{fragments/commonNav :: navBar}"></div>
<div style="width:95%;margin:20px auto;">
    <h3>工作流‑已办任务查询</h3>

    <div class="search-form">
        <form th:action="@{/todoTask/donePage}" method="get">
            <span class="label-text">查询办理人：</span>
            <input type="text" name="assignee" th:value="${searchUser}" placeholder="请输入办理人账号"/>
            <button type="submit">搜索</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>任务ID</th>
            <th>
                <a th:href="@{/todoTask/donePage(
                    sortField='taskName',
                    sortOrder=${sortField == 'taskName' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
            )}">
                    任务名称
                    <span th:if="${sortField == 'taskName'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                </a>
            </th>
            <th>流程实例ID</th>
            <th>
                <a th:href="@{/todoTask/donePage(
                    sortField='assignee',
                    sortOrder=${sortField == 'assignee' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
                )}">
                    办理人
                    <span th:if="${sortField == 'assignee'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                </a>
            </th>
            <th>
                <a th:href="@{/todoTask/donePage(
                    sortField='createTime',
                    sortOrder=${sortField == 'createTime' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
            )}">
                    创建时间
                    <span th:if="${sortField == 'createTime'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                </a>
            </th>
            <th>完成时间</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${doneList}">
            <td th:text="${item.taskId}"></td>
            <td th:text="${item.taskName}"></td>
            <td th:text="${item.processInstanceId}"></td>
            <td th:text="${item.assignee}"></td>
            <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${#dates.format(item.endTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/pagination :: pagination(
    ${total},
    ${pageNum},
    ${pageSize},
    ${totalPages},
    '/todoTask/donePage',
    ${sortField},
    ${sortOrder}
)}"></div>
</body>
</html>
