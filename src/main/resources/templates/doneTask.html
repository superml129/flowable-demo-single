<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="data-ctx=@{/}">
<head>
    <meta charset="UTF-8">
    <title>已办任务列表</title>
    <link rel="stylesheet" th:href="@{/css/todoTask.css}">
<script th:src="@{/js/ctx.js}"></script>
</head>
<body>
<div th:replace="~{fragments/commonNav :: navBar}"></div>
<div style="width:95%;margin:20px auto;">
    <h3>工作流‑已办任务查询</h3>
    <!-- 表格刷新容器 -->
    <div id="tableWrap">
        <div th:replace="~{fragments/doneTaskTable :: doneTaskTable}"></div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // 全局刷新表格函数，给分页组件调用
    function reloadTable(pageNum, pageSize, sortField, sortOrder, assignee){
        let params = new URLSearchParams();
        params.append('pageNum', pageNum);
        params.append('pageSize', pageSize);
        if(sortField) params.append('sortField', sortField);
        if(sortOrder) params.append('sortOrder', sortOrder);
        if(assignee !== undefined) params.append('assignee', assignee);

        fetch('/todoTask/donePage?' + params.toString(), {
            headers: {
                'X-Requested-With':'XMLHttpRequest'
            }
        })
            .then(res => res.text())
            .then(html => {
                document.getElementById('tableWrap').innerHTML = html;
            })
            .catch(err=>{
                console.error(err);
                alert('加载失败');
            })
    }
    /*]]>*/
</script>
<div th:replace="~{fragments/statusBar :: statusBar}"></div>
</body>
</html>
