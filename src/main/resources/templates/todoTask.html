<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>代办任务列表</title>
    <!--引入独立css静态资源-->
    <link rel="stylesheet" th:href="@{/css/todoTask.css}">
</head>
<body>
<div th:replace="~{fragments/commonNav :: navBar}"></div>
<div style="width:95%;margin:20px auto;">
    <h3>工作流‑代办任务查询</h3>
    <div class="search-form">
        <form th:action="@{/todoTask/toPage}" method="get">
            <span class="label-text">查询办理人：</span>
            <input type="text" name="assignee" th:value="${searchUser}" placeholder="请输入办理人账号"/>
            <input type="hidden" name="pageNum" value="1"/>
            <input type="hidden" name="pageSize" th:value="${pageSize}"/>
            <input type="hidden" name="sortField" th:value="${sortField}"/>
            <input type="hidden" name="sortOrder" th:value="${sortOrder}"/>
            <button type="submit">搜索</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>任务ID</th>
            <th>
                <a th:href="@{/todoTask/toPage(
                    sortField='taskName',
                    sortOrder=${sortField == 'taskName' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
            )}">
                    任务名称
                    <span th:if="${sortField == 'taskName'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                </a>
            </th>
            <th>流程实例ID</th>
            <th>
                <a th:href="@{/todoTask/toPage(
                    sortField='assignee',
                    sortOrder=${sortField == 'assignee' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
            )}">
                    办理人
                    <span th:if="${sortField == 'assignee'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                </a>
            </th>
            <th>
                <a th:href="@{/todoTask/toPage(
                    sortField='createTime',
                    sortOrder=${sortField == 'createTime' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
                )}">
                    创建时间
                    <span th:if="${sortField == 'createTime'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                </a>
            </th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${todoList}">
            <td th:text="${item.taskId}"></td>
            <td th:text="${item.taskName}"></td>
            <td th:text="${item.processInstanceId}"></td>
            <td th:text="${item.assignee}"></td>
            <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <button class="completeBtn" th:data-task-id="${item.taskId}">完成任务</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/pagination :: pagination(
    ${total},
    ${pageNum},
    ${pageSize},
    ${totalPages},
    '/todoTask/toPage',
    ${sortField},
    ${sortOrder}
)}"></div>

<script>
    window.onload = function(){
        let btnList = document.querySelectorAll(".completeBtn");
        for(let btn of btnList){
            btn.onclick = function (){
                let taskId = this.dataset.taskId;
                if(!confirm("确认完成该代办任务？")) return;
                fetch("/task/complete?taskId="+taskId,{method:"POST"})
                    .then(resp=>resp.text())
                    .then(res=>{
                        alert(res);
                        window.location.reload();
                    })
            }
        }
    }
</script>
</body>
</html>
