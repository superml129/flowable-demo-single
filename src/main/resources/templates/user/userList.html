<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成员管理</title>
    <link rel="stylesheet" th:href="@{/css/todoTask.css}">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232b5797'/><path d='M20 22h24v6H20zM20 32h16v6H20zM20 42h24v6H20z' fill='white'/></svg>">
    <style>
        body{padding:0;background:#f3f6fa;}

        .user-wrap{padding:16px 20px 24px;min-height:calc(100vh - 60px);}

        .card{
            background:#fff;border-radius:8px;
            box-shadow:0 1px 12px rgba(0,0,0,.07);
        }

        /* ---- 顶部工具栏 ---- */
        .toolbar2{
            display:flex;align-items:center;gap:10px;flex-wrap:wrap;
            padding:14px 18px;border-bottom:1px solid #eaeef3;
        }
        .toolbar2 h3{font-size:16px;color:#2c3e50;font-weight:600;margin-right:6px;}
        .toolbar2 input[type=text]{
            height:34px;padding:0 11px;font-size:13px;width:220px;
            border:1px solid #cbd5e1;border-radius:5px;outline:none;
        }
        .toolbar2 input[type=text]:focus{border-color:#3671d9;}
        .toolbar2 select{
            height:34px;padding:0 8px;font-size:13px;
            border:1px solid #cbd5e1;border-radius:5px;outline:none;background:#fff;
        }
        .toolbar2 .spacer{flex:1;}
        .stat{font-size:13px;color:#7a8699;}

        .btn-primary{
            background:#2b5797;color:#fff;border:none;border-radius:5px;
            padding:8px 16px;font-size:13px;cursor:pointer;transition:background .2s;
        }
        .btn-primary:hover{background:#21456f;}
        .btn-primary[disabled]{background:#b8c4d4;cursor:not-allowed;}
        .btn-ghost{
            background:#fff;border:1px solid #cbd5e1;color:#43536b;
            border-radius:5px;padding:6px 13px;font-size:13px;cursor:pointer;
        }
        .btn-ghost:hover{border-color:#94a0b0;background:#f7f9fc;}
        .btn-danger{
            background:#fff;border:1px solid #e6b8b8;color:#c0392b;
            border-radius:5px;padding:6px 13px;font-size:13px;cursor:pointer;
        }
        .btn-danger:hover{background:#fdf2f2;border-color:#d99;}

        /* ---- 表格 ---- */
        .tbl-wrap{overflow-x:auto;}
        table.usertbl{
            width:100%;border-collapse:collapse;margin:0;
        }
        table.usertbl th{
            background:#2b5797;color:#fff;font-weight:500;font-size:13px;
            padding:11px 14px;text-align:left;white-space:nowrap;
            border:none;border-right:1px solid rgba(255,255,255,.22);
        }
        table.usertbl th:last-child{border-right:none;}
        table.usertbl td{
            padding:11px 14px;font-size:13px;color:#33404f;
            border-bottom:1px solid #eef2f7;vertical-align:middle;
            text-align:left;
        }
        table.usertbl tbody tr:nth-child(even){background:#fafcff;}
        table.usertbl tbody tr:hover{background:#f2f7fd;}
        table.usertbl tr.inactive td{color:#9aa4b2;}
        table.usertbl tr.inactive .u-acc{text-decoration:line-through;}

        .u-acc{font-family:Consolas,monospace;font-size:13px;color:#22303f;}
        .avatar{
            width:30px;height:30px;border-radius:50%;flex-shrink:0;
            background:#dbe7f6;color:#2b5797;font-size:13px;font-weight:600;
            display:inline-flex;align-items:center;justify-content:center;
            margin-right:9px;vertical-align:middle;
        }
        .avatar.off{background:#eef1f5;color:#9aa4b2;}
        .u-cell{display:flex;align-items:center;}

        .tag{
            display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;
        }
        .tag-on{background:#e7f6ec;color:#1f8a4c;}
        .tag-off{background:#f4f6f8;color:#8a95a5;}
        .tag-pos{background:#eef2fb;color:#3d5a99;margin-right:4px;margin-bottom:2px;}
        .tag-pos.primary{background:#fff7e0;color:#b8860b;}
        .pos-cell{max-width:280px;line-height:1.7;}

        .ops{white-space:nowrap;}
        .ops button{margin-right:6px;}
        .linkbtn{
            background:none;border:none;padding:0;cursor:pointer;
            font-size:13px;color:#2b5797;line-height:1;
        }
        .linkbtn:hover{text-decoration:underline;}
        .linkbtn.danger{color:#c0392b;}

        .empty-row td{
            text-align:center;padding:40px 0;color:#9aa4b2;font-size:13.5px;
        }

        /* ---- 弹窗 ---- */
        .modal{
            display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);
            z-index:1000;align-items:center;justify-content:center;
        }
        .modal.show{display:flex;}
        .modal-box{
            width:520px;max-width:calc(100vw - 40px);background:#fff;border-radius:10px;
            box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden;
            max-height:calc(100vh - 60px);display:flex;flex-direction:column;
            animation:pop .16s ease-out;
        }
        @keyframes pop{from{transform:translateY(-8px);opacity:.6}to{transform:none;opacity:1}}
        .modal-box h3{
            margin:0;padding:16px 20px;font-size:15px;color:#243447;
            border-bottom:1px solid #eef2f7;background:#fafcff;flex-shrink:0;
        }
        .modal-body{padding:18px 20px;overflow-y:auto;}
        .modal-foot{
            padding:13px 20px;border-top:1px solid #eef2f7;background:#fafcff;
            display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
        }
        .fld{margin-bottom:16px;}
        .fld:last-child{margin-bottom:0;}
        .fld label{display:block;font-size:13px;color:#4a5768;margin-bottom:6px;}
        .fld label .req{color:#e74c3c;margin-left:2px;}
        .fld input[type=text],.fld input[type=password],.fld select{
            width:100%;padding:9px 11px;font-size:13px;
            border:1px solid #cbd5e1;border-radius:6px;outline:none;
            font-family:inherit;transition:border-color .15s;
        }
        .fld input:focus,.fld select:focus{border-color:#3671d9;}
        .fld .tip{font-size:12px;color:#94a0b0;margin-top:5px;line-height:1.6;}
        .err-text{
            font-size:12.5px;color:#c0392b;background:#fdecec;
            padding:8px 10px;border-radius:5px;margin-bottom:14px;display:none;
        }
        .err-text.show{display:block;}

        /* 岗位勾选区 */
        .pos-picker{
            border:1px solid #e3e9f0;border-radius:6px;
            max-height:190px;overflow-y:auto;padding:6px;
        }
        .pos-row{
            display:flex;align-items:center;gap:9px;
            padding:7px 9px;border-radius:5px;font-size:13px;
        }
        .pos-row:hover{background:#f7fbff;}
        .pos-row input[type=checkbox]{margin:0;cursor:pointer;flex-shrink:0;}
        .pos-row .pname{color:#22303f;}
        .pos-row .pcode{color:#94a0b0;font-size:12px;font-family:Consolas,monospace;}
        .pos-row .primary-pick{
            margin-left:auto;flex-shrink:0;
            display:inline-flex;align-items:center;gap:4px;
            font-size:11.5px;color:#8a95a5;
            padding:2px 8px;border-radius:9px;
            border:1px solid #e0e6ee;background:#f7f9fc;
            cursor:pointer;transition:all .15s;user-select:none;
        }
        .pos-row .primary-pick:hover{border-color:#d9b44a;color:#b8860b;background:#fffbea;}
        .pos-row .primary-pick .dot{
            width:7px;height:7px;border-radius:50%;
            border:1px solid #b8c2d0;background:#fff;
        }
        .pos-row .primary-pick.on{border-color:#e6c65c;background:#fff7e0;color:#b8860b;font-weight:600;}
        .pos-row .primary-pick.on .dot{background:#e0a800;border-color:#e0a800;}
        .pos-row .primary-pick.disabled{opacity:.45;cursor:not-allowed;}
        .picker-empty{padding:16px;text-align:center;color:#9aa4b2;font-size:12.5px;}

        /* 轻提示 */
        #toast{
            position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);
            background:#243447;color:#fff;padding:10px 18px;border-radius:6px;
            font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:2000;
            box-shadow:0 6px 20px rgba(0,0,0,.2);
        }
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
        #toast.ok{background:#1f8a4c;}
        #toast.bad{background:#c0392b;}
    </style>
</head>
<body>

<div th:replace="~{fragments/commonNav :: navBar}"></div>

<div class="user-wrap">
    <div class="card">
        <!-- 工具栏 -->
        <div class="toolbar2">
            <h3>成员管理</h3>
            <input type="text" id="kw" placeholder="搜索账号或姓名…">
            <select id="statusFilter">
                <option value="">全部状态</option>
                <option value="1">仅启用</option>
                <option value="0">仅停用</option>
            </select>
            <span class="stat" id="statText"></span>
            <span class="spacer"></span>
            <button class="btn-ghost" id="btnRefresh">刷新</button>
            <button class="btn-primary" id="btnNew">+ 新增成员</button>
        </div>

        <!-- 列表 -->
        <div class="tbl-wrap">
            <table class="usertbl">
                <thead>
                <tr>
                    <th style="width:60px;">ID</th>
                    <th style="width:200px;">账号</th>
                    <th style="width:140px;">姓名</th>
                    <th style="width:90px;">状态</th>
                    <th>所属岗位</th>
                    <th style="width:170px;">操作</th>
                </tr>
                </thead>
                <tbody id="tbody">
                <tr class="empty-row"><td colspan="6">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============ 新增/编辑弹窗 ============ -->
<div class="modal" id="formModal">
    <div class="modal-box">
        <h3 id="modalTitle">新增成员</h3>
        <div class="modal-body">
            <div class="err-text" id="formErr"></div>
            <div class="fld">
                <label>账号<span class="req">*</span></label>
                <input type="text" id="fUsername" placeholder="如 zhangsan" autocomplete="off">
                <div class="tip">登录用的用户名，只能包含字母、数字、下划线，至少 2 个字符。</div>
            </div>
            <div class="fld">
                <label>姓名</label>
                <input type="text" id="fRealName" placeholder="如 张三" autocomplete="off">
            </div>
            <div class="fld">
                <label id="pwdLabel">密码<span class="req">*</span></label>
                <input type="password" id="fPassword" placeholder="请输入密码" autocomplete="new-password">
                <div class="tip" id="pwdTip">新增成员必须设置密码。</div>
            </div>
            <div class="fld">
                <label>状态</label>
                <select id="fStatus">
                    <option value="1">启用</option>
                    <option value="0">停用</option>
                </select>
                <div class="tip">停用后该账号无法登录系统。</div>
            </div>
            <div class="fld">
                <label>所属岗位</label>
                <div class="pos-picker" id="posPicker">
                    <div class="picker-empty">加载中…</div>
                </div>
                <div class="tip">可多选；点右侧「主责」指定主责岗位（再点取消）。一人最多一个主责岗位。</div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn-ghost" id="btnCancelForm">取消</button>
            <button class="btn-primary" id="btnSubmitForm">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<div th:replace="~{fragments/statusBar :: statusBar}"></div>

<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);

    let users = [];
    let allPositions = [];       // [{id, code, name, description}]
    let editingId = null;
    let formChecked = new Set(); // 弹窗里已勾选的岗位 code
    let formPrimary = null;      // 弹窗里选中的主责 code

    // ==================== 轻提示 ====================
    let toastTimer = null;
    function toast(msg, type) {
        const el = $('toast');
        el.textContent = msg;
        el.className = 'show ' + (type || '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.className = ''; }, 2400);
    }

    // ==================== 工具 ====================
    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function getJson(url) {
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }

    async function postJson(url, body, method) {
        const res = await fetch(url, {
            method: method || 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: body === undefined ? undefined : JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }

    // ==================== 列表 ====================
    async function loadUsers() {
        const kw = $('kw').value.trim();
        const st = $('statusFilter').value;
        let url = '/user/rows?';
        if (kw) url += 'keyword=' + encodeURIComponent(kw) + '&';
        if (st !== '') url += 'status=' + encodeURIComponent(st);

        try {
            users = await getJson(url) || [];
        } catch (e) {
            users = [];
            toast('加载失败：' + e.message, 'bad');
        }
        renderTable();
    }

    function renderTable() {
        const tbody = $('tbody');
        if (!users.length) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="6">没有匹配的成员</td></tr>';
            $('statText').textContent = '';
            return;
        }

        const onCount = users.filter(u => u.status === 1).length;
        $('statText').textContent = '共 ' + users.length + ' 人（启用 ' + onCount + '）';

        let html = '';
        users.forEach(u => {
            const inactive = u.status !== 1;
            const initial = (u.realName || u.username || '?').trim().charAt(0).toUpperCase();
            const posCell = renderPositions(u);
            html += `
            <tr class="${inactive ? 'inactive' : ''}" data-id="${u.id}">
                <td>${u.id}</td>
                <td>
                    <div class="u-cell">
                        <span class="avatar${inactive ? ' off' : ''}">${esc(initial)}</span>
                        <span class="u-acc">${esc(u.username)}</span>
                    </div>
                </td>
                <td>${esc(u.realName) || '<span style="color:#b6bfcb;">—</span>'}</td>
                <td>${inactive ? '<span class="tag tag-off">停用</span>' : '<span class="tag tag-on">启用</span>'}</td>
                <td class="pos-cell" data-poscell="${u.id}">
                    ${posCell}
                </td>
                <td class="ops">
                    <button class="linkbtn" data-act="edit" data-id="${u.id}">编辑</button>
                    <button class="linkbtn" data-act="toggle" data-id="${u.id}">
                        ${inactive ? '启用' : '停用'}
                    </button>
                    <button class="linkbtn danger" data-act="del" data-id="${u.id}">删除</button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;

        tbody.querySelectorAll('button[data-act]').forEach(btn => {
            btn.onclick = function () {
                const id = parseInt(btn.dataset.id, 10);
                const act = btn.dataset.act;
                if (act === 'edit') openForm(id);
                else if (act === 'toggle') toggleStatus(id);
                else if (act === 'del') deleteUser(id);
            };
        });
    }

    function renderPositions(u) {
        // 列表接口不返回岗位明细，这里先显示数量；详情在展开时拉取
        if (!u.positionCount) {
            return '<span style="color:#b6bfcb;">未分配</span>';
        }
        return '<span class="tag tag-pos" data-pos-loading="' + u.id + '">加载中…</span>';
    }

    /**
     * 列表渲染后补齐每行的岗位标签（按需并发请求）
     */
    async function fillPositionTags() {
        const cells = document.querySelectorAll('[data-poscell]');
        for (const cell of cells) {
            const id = parseInt(cell.dataset.poscell, 10);
            try {
                const ps = await getJson('/user/' + id + '/positions') || [];
                if (!ps.length) {
                    cell.innerHTML = '<span style="color:#b6bfcb;">未分配</span>';
                    continue;
                }
                let h = '';
                ps.forEach(p => {
                    h += '<span class="tag tag-pos' + (p.isPrimary === 1 ? ' primary' : '') + '">'
                        + esc(p.name) + (p.isPrimary === 1 ? ' · 主责' : '') + '</span>';
                });
                cell.innerHTML = h;
            } catch (e) {
                cell.innerHTML = '<span style="color:#b6bfcb;">—</span>';
            }
        }
    }

    // ==================== 启用 / 停用 ====================
    async function toggleStatus(id) {
        const u = users.filter(x => x.id === id)[0];
        if (!u) return;
        const target = u.status === 1 ? 0 : 1;
        if (target === 0 && !confirm('停用后「' + u.username + '」将无法登录系统，确定吗？')) {
            return;
        }
        try {
            const r = await postJson('/user/save', {
                id: u.id,
                username: u.username,
                realName: u.realName,
                status: target
            });
            if (r && r.success) {
                toast(target === 1 ? '已启用' : '已停用', 'ok');
                await loadUsers();
                await fillPositionTags();
            } else {
                toast((r && r.message) || '操作失败', 'bad');
            }
        } catch (e) {
            toast('操作失败：' + e.message, 'bad');
        }
    }

    // ==================== 删除 ====================
    async function deleteUser(id) {
        const u = users.filter(x => x.id === id)[0];
        if (!u) return;
        if (!confirm('确定删除成员「' + u.username + '」吗？\n\n' +
            '该成员与岗位的归属关系会一并删除，此操作不可恢复。')) {
            return;
        }
        try {
            const r = await postJson('/user/' + id, undefined, 'DELETE');
            if (r && r.success) {
                toast('已删除', 'ok');
                await loadUsers();
                await fillPositionTags();
            } else {
                toast((r && r.message) || '删除失败', 'bad');
            }
        } catch (e) {
            toast('删除失败：' + e.message, 'bad');
        }
    }

    // ==================== 弹窗 ====================
    async function openForm(id) {
        editingId = id || null;
        formChecked = new Set();
        formPrimary = null;

        const isEdit = editingId !== null;
        $('modalTitle').textContent = isEdit ? '编辑成员' : '新增成员';
        $('pwdLabel').innerHTML = isEdit ? '密码' : '密码<span class="req">*</span>';
        $('pwdTip').textContent = isEdit ? '留空表示不修改当前密码。' : '新增成员必须设置密码。';
        $('fPassword').value = '';
        hideFormErr();

        // 岗位下拉池
        if (!allPositions.length) {
            try {
                allPositions = await getJson('/position/list') || [];
            } catch (e) {
                allPositions = [];
            }
        }

        if (isEdit) {
            // 取详情（基本信息 + 已分配岗位）
            let detail = null;
            try {
                const r = await getJson('/user/' + editingId);
                if (r && r.success) detail = r.data;
            } catch (e) { /* 忽略 */ }

            if (!detail) {
                toast('读取用户信息失败', 'bad');
                return;
            }
            $('fUsername').value = detail.username || '';
            $('fRealName').value = detail.realName || '';
            $('fStatus').value = String(detail.status === 0 ? 0 : 1);

            (detail.positions || []).forEach(p => {
                formChecked.add(p.code);
                if (p.isPrimary === 1) formPrimary = p.code;
            });
        } else {
            $('fUsername').value = '';
            $('fRealName').value = '';
            $('fStatus').value = '1';
        }

        renderPosPicker();
        $('formModal').classList.add('show');
        setTimeout(function () { $('fUsername').focus(); }, 30);
    }

    function renderPosPicker() {
        const box = $('posPicker');
        if (!allPositions.length) {
            box.innerHTML = '<div class="picker-empty">还没有岗位，请先到「岗位管理」创建</div>';
            return;
        }
        let html = '';
        allPositions.forEach(p => {
            const checked = formChecked.has(p.code);
            const isPrimary = formPrimary === p.code && checked;
            html += `
            <div class="pos-row" data-code="${esc(p.code)}">
                <input type="checkbox" ${checked ? 'checked' : ''} data-code="${esc(p.code)}"
                       title="勾选加入该岗位">
                <span class="pname">${esc(p.name)}</span>
                <span class="pcode">${esc(p.code)}</span>
                <span class="primary-pick${isPrimary ? ' on' : ''}${checked ? '' : ' disabled'}"
                      data-code="${esc(p.code)}"
                      title="${checked ? '设为主责岗位' : '先勾选才能设主责'}">
                    <span class="dot"></span><span>主责</span>
                </span>
            </div>`;
        });
        box.innerHTML = html;

        box.querySelectorAll('input[type=checkbox]').forEach(cb => {
            cb.onchange = function () {
                const code = cb.dataset.code;
                if (cb.checked) {
                    formChecked.add(code);
                } else {
                    formChecked.delete(code);
                    if (formPrimary === code) formPrimary = null;
                }
                renderPosPicker();
            };
        });

        box.querySelectorAll('.primary-pick').forEach(el => {
            el.onclick = function (e) {
                e.preventDefault();
                e.stopPropagation();
                const code = el.dataset.code;
                if (!formChecked.has(code)) {
                    toast('请先勾选该岗位', 'bad');
                    return;
                }
                formPrimary = (formPrimary === code) ? null : code;
                renderPosPicker();
            };
        });
    }

    function closeForm() {
        $('formModal').classList.remove('show');
    }

    function showFormErr(msg) {
        const el = $('formErr');
        el.textContent = msg;
        el.classList.add('show');
    }

    function hideFormErr() {
        $('formErr').classList.remove('show');
    }

    async function submitForm() {
        const username = $('fUsername').value.trim();
        const password = $('fPassword').value;
        const realName = $('fRealName').value.trim();
        const status = parseInt($('fStatus').value, 10);

        if (!username) { showFormErr('请填写账号'); return; }
        if (username.length < 2) { showFormErr('账号至少 2 个字符'); return; }
        if (!/^[A-Za-z0-9_]+$/.test(username)) { showFormErr('账号只能包含字母、数字和下划线'); return; }
        if (editingId === null && !password) { showFormErr('新增成员必须设置密码'); return; }

        const btn = $('btnSubmitForm');
        btn.disabled = true;
        const oldText = btn.textContent;
        btn.textContent = '保存中…';

        try {
            const body = {
                id: editingId,
                username: username,
                password: password || '',
                realName: realName,
                status: status
            };
            const r = await postJson('/user/save', body);
            if (!r || !r.success) {
                showFormErr((r && r.message) || '保存失败');
                return;
            }

            // 保存岗位归属
            const userId = (r.data && r.data.id) || editingId;
            const codes = Array.from(formChecked);
            const pr = await postJson('/user/' + userId + '/positions', {
                codes: codes,
                primaryCode: formPrimary || ''
            });
            if (!pr || !pr.success) {
                showFormErr((pr && pr.message) || '岗位归属保存失败');
                return;
            }

            closeForm();
            toast(editingId === null ? '成员已创建' : '成员已更新', 'ok');
            await loadUsers();
            await fillPositionTags();
        } catch (e) {
            showFormErr('保存失败：' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = oldText;
        }
    }

    // ==================== 事件绑定 ====================
    $('btnNew').onclick = function () { openForm(null); };
    $('btnRefresh').onclick = async function () {
        await loadUsers();
        await fillPositionTags();
    };
    $('btnCancelForm').onclick = closeForm;
    $('btnSubmitForm').onclick = submitForm;

    let kwTimer = null;
    $('kw').oninput = function () {
        clearTimeout(kwTimer);
        kwTimer = setTimeout(async function () {
            await loadUsers();
            await fillPositionTags();
        }, 250);
    };
    $('statusFilter').onchange = async function () {
        await loadUsers();
        await fillPositionTags();
    };

    $('formModal').addEventListener('click', function (e) {
        if (e.target === this) closeForm();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && $('formModal').classList.contains('show')) closeForm();
    });

    // ==================== 启动 ====================
    (async function () {
        await loadUsers();
        await fillPositionTags();
    })();
})();
</script>
</body>
</html>
