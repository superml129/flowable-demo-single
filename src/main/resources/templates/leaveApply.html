<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:attr="data-ctx=@{/}">
<head>
  <meta charset="UTF-8">
  <title>提交申请</title>
  <link rel="stylesheet" th:href="@{/css/todoTask.css}">
<script th:src="@{/js/ctx.js}"></script>
</head>
<div th:replace="~{fragments/commonNav :: navBar}"></div>
<body>
<div class="container">
  <h3>提交申请</h3>

  <div th:if="${msg}" class="success-msg">
    [[${msg}]]
  </div>

  <form th:action="@{/leaveApply/submit}" method="post" class="form-box">
    <div class="form-item">
      <label>请假申请人：</label>
      <input type="text" name="applyUser" required placeholder="请输入申请人账号">
    </div>
    <div class="form-item">
      <label>请假天数：</label>
      <input type="number" name="leaveDays" min="1" max="30" required placeholder="请假天数">
    </div>
    <div class="form-item">
      <label>请假原因：</label>
      <textarea name="leaveReason" rows="4" required placeholder="填写请假事由"></textarea>
    </div>
    <div class="form-item">
      <label>审批岗位：</label>
      <select name="approvePosition">
        <option value="POS_DEPT_MANAGER">部门经理（POS_DEPT_MANAGER）</option>
        <option value="POS_GM_OFFICE">总经理办公室（POS_GM_OFFICE）</option>
      </select>
      <div class="form-tip" style="color:#888;font-size:12px;">
        流程节点绑定的是岗位，岗位内所有人都会在待办中看到该任务，先认领者办理。
      </div>
    </div>
    <div class="btn-row">
      <button type="submit" class="search-btn">提交申请</button>
    </div>
  </form>
</div>
<div th:replace="~{fragments/statusBar :: statusBar}"></div>
</body>
</html>
