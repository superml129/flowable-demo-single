<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:attr="data-ctx=@{/}">
<head>
  <meta charset="UTF-8">
  <title>请假申请</title>
  <link rel="stylesheet" th:href="@{/css/todoTask.css}">
  <link rel="stylesheet" th:href="@{/css/leaveFlow.css}">
  <script th:src="@{/js/ctx.js}"></script>
</head>
<body>
<div th:replace="~{fragments/commonNav :: navBar}"></div>

<div class="lf-page">
  <div class="lf-card">

    <div class="lf-head">
      <div class="lf-head-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div>
        <h2>请假申请</h2>
        <p>提交后按流程节点绑定的岗位自动流转，无需选择审批岗位或审批人</p>
      </div>
    </div>

    <div th:if="${msg}" class="success-msg">[[${msg}]]</div>
    <div th:if="${errMsg}" class="warn-msg">[[${errMsg}]]</div>

    <form th:action="@{/leaveApply/submit}" method="post" autocomplete="off">
      <!-- 发起人：锁定当前登录人，服务端同样以 session 为准，防止冒名提交 -->
      <div class="lf-field">
        <label>发起人<span class="req">*</span></label>
        <div class="lf-readonly">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          [[${session.loginUser}]]
          <span style="font-weight:normal;color:#8492a6;">（当前登录账号，不可修改）</span>
        </div>
      </div>

      <div class="lf-field">
        <label>请假天数<span class="req">*</span></label>
        <div class="lf-suffix">
          <input class="lf-input" type="number" name="leaveDays" min="1" max="30" required placeholder="1 - 30"/>
          <span class="lf-suffix-txt">天</span>
        </div>
        <div class="lf-tip">超过 3 天的申请与 3 天以内走相同的审批节点，仅作为流程变量留痕</div>
      </div>

      <div class="lf-field">
        <label>请假事由<span class="req">*</span></label>
        <textarea class="lf-textarea" name="leaveReason" required placeholder="请填写请假事由，审批人可在办理页看到此内容"></textarea>
      </div>

      <!-- 流转说明：节点顺序与 BPMN 中 userTask 绑定的 candidateGroups 一致 -->
      <div class="lf-steps">
        <div class="lf-step done">
          <div class="dot">1</div>
          <div class="name">提交申请</div>
          <div class="sub">[[${session.loginUser}]]</div>
        </div>
        <div class="lf-step">
          <div class="dot">2</div>
          <div class="name">部门经理审批</div>
          <div class="sub">岗位待办 · 认领办理</div>
        </div>
        <div class="lf-step">
          <div class="dot">3</div>
          <div class="name">总经理审批</div>
          <div class="sub">岗位待办 · 认领办理</div>
        </div>
        <div class="lf-step">
          <div class="dot">4</div>
          <div class="name">审批归档</div>
          <div class="sub">流程结束</div>
        </div>
      </div>
      <div class="lf-tip" style="margin-top:-14px;margin-bottom:4px;">
        上述节点由流程设计里的 <code>candidateGroups</code> 绑定决定，岗位内所有成员的待办中都会出现该任务，先认领者办理。
      </div>

      <div class="lf-actions">
        <button type="submit" class="lf-btn">提交申请</button>
        <a class="lf-plain-btn" th:href="@{/home/index}">返回首页</a>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/statusBar :: statusBar}"></div>
</body>
</html>
