<!DOCTYPE html>
<html lang="zh‑CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>通用审批系统首页</title>
    <link rel="stylesheet" th:href="@{/css/todoTask.css}">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232b5797'/><path d='M20 22h24v6H20zM20 32h16v6H20zM20 42h24v6H20z' fill='white'/></svg>">
</head>
<body>

<div th:replace="~{fragments/commonNav :: navBar}"></div>
<!--页面主体：左侧菜单 + 右侧内容-->
<div class="page-wrap">
    <!--左侧侧边栏菜单-->
    <div class="left-sidebar" id="sidebar">
        <div class="sidebar-title">菜单</div>
        <div class="sidebar-menu">
            <a th:href="@{/leaveApply/toPage}">📝 提交申请</a>
            <a th:href="@{/todoTask/toPage(assignee=${session.loginUser})}">✅ 代办任务查询</a>
            <a th:href="@{/todoTask/donePage(assignee=${session.loginUser})}">📋 已办任务查询</a>
        </div>
        <!-- 拖动分割线DOM -->
        <div class="drag-line" id="dragLine"></div>
    </div>

    <!--右侧内容区域：代办任务表格-->
    <div class="main-content" style="margin:20px auto;width:95%;">
        <div th:if="${msg}" class="success-msg">[[${msg}]]</div>

        <h3 style="margin-top:30px;">🏠我的代办任务</h3>
        <table class="todo-table">
            <thead>
            <tr>
                <th>任务ID</th>
                <th>
                    <a th:href="@{/home/index(
                    sortField='taskName',
                    sortOrder=${sortField == 'taskName' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
                )}">
                        任务名称
                        <span th:if="${sortField == 'taskName'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                    </a>
                </th>
                <th>流程实例ID</th>
                <th>
                    <a th:href="@{/home/index(
                    sortField='createTime',
                    sortOrder=${sortField == 'createTime' and sortOrder=='asc' ? 'desc' : 'asc'},
                    pageNum=${pageNum},
                    pageSize=${pageSize}
            )}">
                        创建时间
                        <span th:if="${sortField == 'createTime'}">[[${sortOrder == 'asc' ? '↑' : '↓'}]]</span>
                    </a>
                </th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${homeTodoList}">
                <td th:text="${item.taskId}"></td>
                <td th:text="${item.taskName}"></td>
                <td th:text="${item.processInstanceId}"></td>
                <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td>
                    <a class="btn-edit" th:href="@{/todoTask/toAudit(taskId=${item.taskId})}">办理</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(homeTodoList)}">
                <td colspan="5" style="text-align:center;">暂无代办任务</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/pagination :: pagination(
            ${todoTotal},
            ${pageNum},
            ${pageSize},
            ${totalPages},
            '/home/index',
            ${sortField},
            ${sortOrder}
        )}"></div>
    </div>
</div>

<script>
    // 侧边栏拖动JS
    const sidebar = document.getElementById('sidebar');
    const dragLine = document.getElementById('dragLine');
    let isDragging = false;
    let startX;
    let startWidth;

    dragLine.addEventListener('mousedown', (e) => {
        isDragging = true;
        // 记录按下瞬间的鼠标位置、侧边栏当前宽度
        startX = e.clientX;
        startWidth = sidebar.offsetWidth;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none'; //拖动时禁止文字选中
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        // 最小宽度160px，最大400px，防止拉太小/太大
        // 计算宽度变化量
        const diffX = e.clientX - startX;
        let newWidth = startWidth + diffX;
        if (newWidth < 160) newWidth = 160;
        if (newWidth > 400) newWidth = 400;
        sidebar.style.width = newWidth + 'px';
    });
    document.addEventListener('mouseup', () => {
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });

    // 切换每页条数的逻辑已统一在 fragments/pagination.html 中处理（document 级事件委托）
</script>

</body>
</html>
