<!DOCTYPE html>
<html lang="zh‑CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>通用审批系统首页</title>
    <link rel="stylesheet" th:href="@{/css/todoTask.css}">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232b5797'/><path d='M20 22h24v6H20zM20 32h16v6H20zM20 42h24v6H20z' fill='white'/></svg>">
    <style>
        /* 侧边栏菜单项改为「图标 + 文字」布局，图标用内联 SVG，
           避免 emoji 在深色侧边栏里继承浅灰文字色、被渲染成灰色剪影 */
        .sidebar-menu a{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .sidebar-menu .mi{
            width:18px;
            height:18px;
            flex-shrink:0;
            /* 图标不跟随文字色：深蓝底上文字是 #e6e6e6，图标沿用会显得发灰。
               这里统一给亮色描边，hover 时再变纯白。 */
            color:#dbe8f8;
            stroke-width:1.9;
            transition:color .15s;
        }
        .sidebar-menu a:hover .mi{
            color:#ffffff;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/commonNav :: navBar}"></div>
<!--页面主体：左侧菜单 + 右侧内容-->
<div class="page-wrap">
    <!--左侧侧边栏菜单-->
    <div class="left-sidebar" id="sidebar">
        <div class="sidebar-title">菜单</div>
        <div class="sidebar-menu">
            <a th:href="@{/leaveApply/toPage}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                提交申请
            </a>
            <a th:href="@{/todoTask/toPage(assignee=${session.loginUser})}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                代办任务查询
            </a>
            <a th:href="@{/todoTask/donePage(assignee=${session.loginUser})}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
                已办任务查询
            </a>
            <a th:href="@{/flow/editor}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3z"/><path d="M14 14h7v7h-7z"/><path d="M10 6.5h4a3 3 0 0 1 3 3v4.5"/></svg>
                流程设计
            </a>
            <a th:href="@{/flowDef/listPage}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
                流程定义管理
            </a>
            <a th:href="@{/position/page}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                岗位管理
            </a>
            <a th:href="@{/user/page}">
                <svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                成员管理
            </a>
        </div>
        <!-- 拖动分割线DOM -->
        <div class="drag-line" id="dragLine"></div>
    </div>

    <!--右侧内容区域：代办任务表格-->
    <div class="main-content" style="margin:20px auto;width:95%;">
        <div th:if="${msg}" class="success-msg">[[${msg}]]</div>

        <h3 style="margin-top:30px;">我的代办任务</h3>
        <!-- 复用代办任务表格片段：showAdmin=false 时不显示搜索表单和办理人列 -->
        <div th:replace="~{fragments/todoTaskTable :: todoTaskTable(
            ${homeTodoList},
            ${todoTotal},
            '/home/index',
            false
        )}"></div>
    </div>
</div>

<script>
    // 侧边栏拖动JS
    const sidebar = document.getElementById('sidebar');
    const dragLine = document.getElementById('dragLine');
    let isDragging = false;
    let startX;
    let startWidth;

    dragLine.addEventListener('mousedown', (e) => {
        isDragging = true;
        // 记录按下瞬间的鼠标位置、侧边栏当前宽度
        startX = e.clientX;
        startWidth = sidebar.offsetWidth;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none'; //拖动时禁止文字选中
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        // 最小宽度160px，最大400px，防止拉太小/太大
        // 计算宽度变化量
        const diffX = e.clientX - startX;
        let newWidth = startWidth + diffX;
        if (newWidth < 160) newWidth = 160;
        if (newWidth > 400) newWidth = 400;
        sidebar.style.width = newWidth + 'px';
    });
    document.addEventListener('mouseup', () => {
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });

    // 切换每页条数的逻辑已统一在 fragments/pagination.html 中处理（document 级事件委托）
</script>
<div th:replace="~{fragments/statusBar :: statusBar}"></div>
</body>
</html>
